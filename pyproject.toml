[project]
name = "dc-absolute-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "google-cloud-bigquery>=3.47.0",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/absolute_pipeline"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
